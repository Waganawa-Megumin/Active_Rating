name: deploy

# Fully automated Cloudflare bootstrap + deploy. Runs in GitHub Actions (which
# can reach Cloudflare and run wrangler). The only manual prerequisite is adding
# the repository secrets listed below — no local CLI needed.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   - token with Workers Scripts / D1 / R2 / Queues / Pages edit
#   CLOUDFLARE_ACCOUNT_ID  - your Cloudflare account id
#   INGEST_HMAC_SECRET     - shared HMAC secret (scanner ↔ worker)
#   ADMIN_TOKEN            - bearer token for the registration Admin API
# Optional:
#   SLACK_WEBHOOK_URL      - Slack incoming webhook (notifications)

on:
  workflow_dispatch:
  push:
    branches: [claude/active-rating-app-kqqov5, main]
    paths-ignore:
      - 'deploy/**'
      - 'docs/**'
      - '**/*.md'

concurrency:
  group: active-rating-deploy
  cancel-in-progress: false

permissions:
  contents: write # persist the deployed worker URL back to the repo

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Preflight — required secrets present
        run: |
          missing=0
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!v}" ]; then echo "::error::missing secret $v"; missing=1; fi
          done
          [ -z "${{ secrets.INGEST_HMAC_SECRET }}" ] && { echo "::error::missing secret INGEST_HMAC_SECRET"; missing=1; }
          [ -z "${{ secrets.ADMIN_TOKEN }}" ] && { echo "::error::missing secret ADMIN_TOKEN"; missing=1; }
          exit $missing

      - name: Ensure D1 exists (idempotent, free tier)
        working-directory: worker
        run: npx wrangler d1 create active_rating || echo "d1 already exists"

      - name: Resolve D1 database_id into wrangler.toml
        working-directory: worker
        run: |
          # Resolve by name via `d1 list` (does NOT read the toml placeholder).
          ID=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="active_rating") | .uuid' | head -1)
          if [ -z "$ID" ]; then echo "::error::could not resolve D1 id"; exit 1; fi
          echo "resolved D1 id: $ID"
          sed -i "s/REPLACE_WITH_D1_DATABASE_ID/$ID/" wrangler.toml

      - name: Apply schema to remote D1
        working-directory: worker
        run: npx wrangler d1 execute active_rating --remote --file=./schema.sql

      - name: Set worker secrets
        working-directory: worker
        run: |
          printf '%s' "${{ secrets.INGEST_HMAC_SECRET }}" | npx wrangler secret put INGEST_HMAC_SECRET
          printf '%s' "${{ secrets.ADMIN_TOKEN }}" | npx wrangler secret put ADMIN_TOKEN
          if [ -n "${{ secrets.SLACK_WEBHOOK_URL }}" ]; then
            printf '%s' "${{ secrets.SLACK_WEBHOOK_URL }}" | npx wrangler secret put SLACK_WEBHOOK_URL
          fi

      - name: Deploy worker (capture URL)
        working-directory: worker
        run: |
          OUT=$(npx wrangler deploy 2>&1) ; echo "$OUT"
          URL=$(echo "$OUT" | grep -oE 'https://[a-z0-9._-]+\.workers\.dev' | head -1)
          if [ -z "$URL" ]; then echo "::error::could not capture worker URL"; exit 1; fi
          echo "AR_WORKER_URL=$URL" >> "$GITHUB_ENV"
          echo "worker deployed at $URL"

      - name: Register targets (GitOps → Admin API)
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        # `npm run -w scanner` runs with the scanner dir as cwd, so use an
        # absolute path to the repo-root targets.yaml.
        run: npm run register -w scanner -- --file "$GITHUB_WORKSPACE/targets.yaml" --api "$AR_WORKER_URL"

      - name: Build + deploy Pages
        run: |
          VITE_API_BASE="$AR_WORKER_URL" npm run build -w pages
          npx wrangler pages project create active-rating --production-branch "${{ github.ref_name }}" || echo "pages project exists"
          npx wrangler pages deploy pages/dist --project-name active-rating --branch "${{ github.ref_name }}"

      - name: Persist worker URL for the scheduled scan
        run: |
          mkdir -p deploy
          printf 'AR_INGEST_URL=%s/ingest\nAR_WORKER_URL=%s\n' "$AR_WORKER_URL" "$AR_WORKER_URL" > deploy/state.env
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deploy/state.env
          git commit -m "chore(deploy): persist worker URL [skip ci]" || echo "no change"
          git push || echo "push skipped"

      - name: Summary
        run: |
          echo "### Active Rating deployed :rocket:" >> "$GITHUB_STEP_SUMMARY"
          echo "- Worker: $AR_WORKER_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- Dashboard (Pages): active-rating project" >> "$GITHUB_STEP_SUMMARY"
          echo "- Scheduled scan will use deploy/state.env" >> "$GITHUB_STEP_SUMMARY"
