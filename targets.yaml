# Active Rating — 対象アセット宣言（GitOps 登録ソース・これが正）
# `npm run register -- --file targets.yaml --api <worker-url> --prune` で
# ここに宣言した組織/ドメインへ D1 をリコンサイル（宣言外の組織は削除）する。
# デプロイ時に自動実行されるため、このファイルが常に「正」となる。
#
#   relation_type: self | subsidiary | supplier | partner | watch
#   active_confirmed: true の self/subsidiary のみ能動(active)。それ以外は passive。

organizations:
  - key: nec
    name: "NEC Corporation"
    relation_type: self
    active_confirmed: true
    slack_channel: "#asm-nec"
    notes: "自組織。能動スキャン許可済み。"
    domains:
      - fqdn: nec.com
        enabled: true
