name = "active-rating"
main = "src/index.ts"
compatibility_date = "2024-11-27"
compatibility_flags = ["nodejs_compat"]

# --- D1 (structured store) ---
# After `wrangler d1 create active_rating`, paste the printed database_id here.
[[d1_databases]]
binding = "DB"
database_name = "active_rating"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

# --- Cron: CT/KEV poll + resend unnotified Slack (every 6h) ---
[triggers]
crons = ["0 */6 * * *"]

# --- Optional paid-tier bindings (disabled by default to stay on the free tier) ---
# R2 requires enabling R2 in the Cloudflare dashboard; Queues require the Workers
# Paid plan. Evidence is stored inline in D1 (proof_json) until R2 is enabled, and
# event-driven re-eval activates once the queue exists. To enable, uncomment and
# re-run the deploy workflow.
#
# [[r2_buckets]]
# binding = "EVIDENCE"
# bucket_name = "active-rating-evidence"
#
# [[queues.producers]]
# binding = "REEVAL_QUEUE"
# queue = "ar-reeval"
#
# [[queues.consumers]]
# queue = "ar-reeval"
# max_batch_size = 10
# max_retries = 3

[vars]
OFFLINE = "0"
SLACK_ENABLED = "1"
ADMIN_USER = "ar-admin"
# Secrets (set via `wrangler secret put`, NEVER commit):
#   INGEST_HMAC_SECRET   - shared with the scanner for /ingest signing
#   ADMIN_TOKEN          - bearer token for the registration Admin API
#   SLACK_WEBHOOK_URL    - Slack incoming webhook
